services:
  mongodb:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5
    networks:
      - pdf_net

  app:
    build: .
    ports:
      - "8002:8000"
    environment:
      DB_URL: mongodb://mongodb:27017
      DB_NAME: pdf_extractext
      EXTRACTOR_URL: http://traefik
      EXTRACTOR_TIMEOUT_SECONDS: "${EXTRACTOR_TIMEOUT_SECONDS:-30}"
      ROOT_PATH: /api
    depends_on:
      mongodb:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - pdf_net
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  # Front end estático en un contenedor aparte (12-Factor: un deployable por
  # componente). nginx sirve la UI y reenvía /api/* a la app. Se construye desde
  # GitHub fijado a un commit para que sea reproducible; se puede sobreescribir
  # con WEB_CONTEXT (por ejemplo WEB_CONTEXT=. para desarrollo local).
  web:
    build:
      context: ${WEB_CONTEXT:-https://github.com/bar-bii/pdf-extractext-web.git#2090d6cb9203029be76af96144d143a4ef89fbf0}
      dockerfile: Dockerfile
    image: pdf-extractext-web:latest
    ports:
      - "8000:80"
    environment:
      API_UPSTREAM: http://app:8000
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - pdf_net

  # Balanceador delante de las réplicas del microservicio de extracción.
  # Solo es accesible dentro de la red; el dashboard queda en loopback.
  traefik:
    image: traefik:v3.7.18
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pdf_net
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.dashboard=true
      - --api.insecure=false
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "127.0.0.1:8081:8080"
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.dashboard.rule=(Host(`localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      - traefik.http.routers.dashboard.entrypoints=traefik
      - traefik.http.routers.dashboard.service=api@internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - pdf_net

  # Microservicio de extracción, construido desde GitHub (fijado a un commit para
  # que el build sea reproducible). Se puede sobreescribir con EXTRACTOR_CONTEXT.
  # 5 réplicas.
  extractor:
    build:
      context: ${EXTRACTOR_CONTEXT:-https://github.com/bar-bii/Microservicios.git#e66b17fc7ec9618bb212c05597e3c9be7edf7807}
      dockerfile: Dockerfile
    image: pdf-extractor-python:latest
    expose:
      - "8000"
    environment:
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      WORKER_POOL_SIZE: "${WORKER_POOL_SIZE:-4}"
      MAX_QUEUE_SIZE: "${MAX_QUEUE_SIZE:-100}"
      MAX_QUEUE_BYTES: "${MAX_QUEUE_BYTES-136314880}"
      QUEUE_ORDER: "${QUEUE_ORDER:-hrrn}"
      MAX_UPLOAD_BYTES: "15728640"
      EXTRACTION_EXECUTOR: "${EXTRACTION_EXECUTOR:-thread}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
    labels:
      - traefik.enable=true
      - traefik.docker.network=pdf_net
      - 'traefik.http.routers.pdf.rule=PathPrefix(`/`)'
      - traefik.http.routers.pdf.entrypoints=web
      - traefik.http.services.pdf.loadbalancer.server.port=8000
      - "traefik.http.services.pdf.loadbalancer.strategy=${LB_STRATEGY:-p2c}"
      - traefik.http.services.pdf.loadbalancer.healthcheck.path=/health
      - traefik.http.services.pdf.loadbalancer.healthcheck.interval=10s
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - pdf_net

networks:
  pdf_net:
    driver: bridge

volumes:
  mongo_data:
