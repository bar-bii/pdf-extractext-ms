[project]
name = "pdf-extractext-ms"
version = "0.1.0"
description = "PDF text extraction API that delegates extraction to a dedicated microservice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beanie>=2.1.0",
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.29",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
